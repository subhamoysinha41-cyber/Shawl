name: Deploy Shawl to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shawl
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Shawl/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build React website
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: Prepare static portfolio site
        run: |
          rm -rf client-dist/*
          cp index.html client-dist/index.html
          cp hello.html client-dist/hello.html
          cp index.js client-dist/index.js
          cp style.css client-dist/style.css
          cp subhamoy.jpeg client-dist/subhamoy.jpeg
          cp edu.html client-dist/edu.html
          cp edu.css client-dist/edu.css
          mkdir -p client-dist/assets
          cp -R assets/images client-dist/assets/
          cp -R assets/js client-dist/assets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the built Vite output, including the project entry point.
          path: Shawl/client-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
